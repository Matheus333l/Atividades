<!DOCTYPE html>

<head>
	<meta charset="UTF-8">
	<meta name="color-scheme" content="light dark">
	<title>Ficha do multímetro</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<h1>Multímetro Digital Hikari</h1>
	<p>Instrumento usado para medir tensão, corrente e resistência elétrica.</p>
	<ol>
		<li>Faixa de tensão: 0-600V</li>
		<li>Precisão: ±0,5%</li>
		<li>Display: LCD 3 dígitos e meio</li>
	</ol>
	<table>
		<tr>
			<th>Grandeza</th>
			<th>Valor medido</th>
		</tr>
		<tr>
			<td>Tensão</td>
			<td>12,4V</td>
		</tr>
		<tr>
			<td>Corrente</td>
			<td>0,8A</td>
		</tr>
	</table>
	<img src="multimetro.jpg" alt="Multímetro digital amarelo sobre uma bancada" width="400" height="400">
